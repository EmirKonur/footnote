[project]
name = "footnote"
version = "0.1.0"
description = "Chat with your documents. Every claim carries a footnote you can check."
license = "MIT"
authors = [{ name = "Emir Konur" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "markdown-it-py>=4.2.0",
    "numpy>=2.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "selectolax>=1.0.2",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
footnote = "footnote.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footnote"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "ASYNC", "S", "N", "C4", "PT", "RET"]
ignore = [
    "S101", # pytest relies on bare asserts
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]

[tool.pyright]
include = ["src", "tests", "scripts", "../evals/corpus"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "embeddings: needs the real local embedding model (downloads it on first run)",
]
