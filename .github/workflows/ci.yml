name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.27"
  # Shared by the eval and e2e jobs so the embedding model downloads once per cache key.
  FOOTNOTE_MODELS_DIR: ${{ github.workspace }}/.models

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts ../evals/corpus
      - run: uv run ruff format --check src tests scripts ../evals/corpus
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  retrieval-eval:
    name: Retrieval eval (offline, regression gate)
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/cache@v6
        with:
          path: .models
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --locked
      - name: Run the eval and compare with the committed report
        run: >
          uv run footnote eval retrieval
          --out ../evals/reports/ci
          --baseline ../evals/reports/retrieval.json --tolerance 0.03
          --fail-under hybrid.recall@5=0.8
      - run: cat ../evals/reports/ci/retrieval.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retrieval-eval
          path: evals/reports/ci/

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/cache@v6
        with:
          path: .models
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --locked
        working-directory: api
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm e2e
        working-directory: web
        env:
          FOOTNOTE_E2E_MODELS_DIR: ${{ env.FOOTNOTE_MODELS_DIR }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
