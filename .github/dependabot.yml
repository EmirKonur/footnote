version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # Kept on the version whose browser build the e2e suite is pinned to.
      - dependency-name: "@playwright/test"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/api", "/web"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
